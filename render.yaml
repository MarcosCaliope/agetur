# Render Blueprint (https://render.com/docs/blueprint-spec): the web service
# and its managed Postgres. Variables with sync: false are asked for when the
# Blueprint is created; see docs/deploy-render.md.
databases:
  - name: agetur-db
    plan: basic-256mb
    region: virginia
    databaseName: agetur_production
    user: agetur
    postgresMajorVersion: "16"

services:
  - type: web
    name: agetur
    runtime: ruby
    plan: starter
    region: virginia
    buildCommand: bin/render-build.sh
    preDeployCommand: bundle exec rails db:migrate && bundle exec rails db:seed
    startCommand: bundle exec puma -C config/puma.rb
    healthCheckPath: /up
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: agetur-db
          property: connectionString
      - key: SECRET_KEY_BASE
        generateValue: true
      - key: RAILS_ENV
        value: production
      - key: BUNDLE_WITHOUT
        value: development:test
      - key: WEB_CONCURRENCY
        value: "0"
      - key: RAILS_MAX_THREADS
        value: "5"
      # Receipts and logos on Cloudflare R2 (config/storage.yml).
      - key: ACTIVE_STORAGE_SERVICE
        value: r2
      - key: R2_ENDPOINT
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET
        sync: false
      # Password reset e-mails (optional until users need them).
      - key: MAILER_FROM
        sync: false
      - key: SMTP_ADDRESS
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
