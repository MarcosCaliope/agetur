# FreeTDS settings for the SISTGER import when SISTGER_DB_ENCRYPTION=off.
# The legacy SQL Server 2014 (RTM) only negotiates TLS 1.0, which current
# FreeTDS/OpenSSL builds refuse, so the connection runs without TLS.
# Updating SQL Server (2014 SP2+ supports TLS 1.2) removes the need for this.
[global]
	tds version = 7.4
	encryption = off
